name: CI

on:
  push:
  pull_request:

jobs:
  test:
    # node-pty is a native module and the app targets Windows shells
    # (powershell.exe / cmd.exe), so the suite runs on windows-latest.
    # See issue #8 for why this is Windows-only for now.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # `npm test` runs `node --test test/*.test.js` and relies on the
          # test runner's built-in glob expansion of that pattern (the
          # default Windows shells, cmd.exe/pwsh, do not expand `*`
          # themselves the way bash does). That glob support isn't present
          # in Node 20, so a current LTS that has it is required here.
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm test
